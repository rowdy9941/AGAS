services:
  agas:
    build: .
    init: true
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      AGAS_BOOTSTRAP_TOKEN: "${AGAS_BOOTSTRAP_TOKEN:-agas-dev-token}"
      AGAS_RUNTIME_EXECUTION: "${AGAS_RUNTIME_EXECUTION:-simulator}"
    volumes:
      - agas-data:/data
      - ./workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  agas-data:
